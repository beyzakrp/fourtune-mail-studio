<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4tune Mail Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f8;color:#202027;font:13px/1.5 Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}button,input,textarea,select{border:1px solid #dddde4;border-radius:8px}button{background:white;color:inherit;padding:9px 13px}button:hover{border-color:#f52e63}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #f52e63;outline-offset:2px}header{height:70px;background:white;border-bottom:1px solid #e6e6eb;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-size:27px;font-weight:850;letter-spacing:-1.5px}.brand small{font-size:11px;font-weight:400;letter-spacing:0;color:#777;margin-left:10px}.save{font-size:11px;color:#777}.primary{background:#f52e63;color:white;border-color:#f52e63}.app{height:calc(100vh - 70px);display:grid;grid-template-columns:360px minmax(0,1fr)}aside{background:white;border-right:1px solid #e6e6eb;overflow:auto;padding:22px}h1{font-size:23px;letter-spacing:-.6px;margin:0}p{color:#777;margin:4px 0 18px}.templates{display:flex;gap:8px;margin:18px 0}.templates button{flex:1;text-align:left;font-size:12px;padding:14px 10px}.templates .active{background:#fff3f6;border-color:#f52e63;color:#d7194c}.tabs{display:flex;gap:5px;border-bottom:1px solid #eee;margin-bottom:16px}.tabs button{border:0;border-radius:0;color:#777;flex:1}.tabs .active{color:#f52e63;border-bottom:2px solid #f52e63}.field{display:block;margin:0 0 17px}.field span{display:block;font-weight:550;margin-bottom:6px}input,textarea,select{background:white;width:100%;padding:10px;color:#292931}textarea{resize:vertical;min-height:85px;line-height:1.6}.image-card{border:1px solid #e7e7ec;border-radius:10px;padding:12px;margin-bottom:16px}.image-card img{width:100%;height:90px;object-fit:contain;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/12px 12px;border-radius:6px;margin:8px 0}.image-card input{font-size:11px;margin:6px 0}.image-card button{font-size:11px;padding:7px}.muted{color:#777;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.preview{display:flex;flex-direction:column;min-width:0}.toolbar{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}.toolbar select{width:auto;padding:6px}.canvas{flex:1;overflow:auto;padding:16px 20px 30px;text-align:center;background:#eaecef}#preview-holder{margin:auto;background:white;box-shadow:0 6px 24px #20202712;overflow:hidden}iframe{border:0;display:block;transform-origin:top left;background:white}.bottom{border-top:1px solid #e0e0e5;background:white;padding:12px 20px;display:flex;gap:10px;justify-content:flex-end}.message{padding:10px 15px;margin:0;background:#fff4dc;color:#684400;font-size:12px;max-height:95px;overflow:auto;white-space:pre-line}.message:empty{display:none}.draft{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;align-items:center}.draft small{display:block;color:#888}#standalone{color:#ac6d00;font-size:11px}.footnote{padding:14px 0;color:#888;font-size:11px}.hidden{display:none!important}
.preview{min-height:0;height:100%;overflow:hidden}.canvas{min-height:0}.toolbar,.bottom{flex-shrink:0}aside{min-height:0;height:100%}
</style></head><body>
<header><div class="brand">4tune <small>MAIL STUDIO</small></div><div><span id="standalone"></span> <span id="save" class="save">Hazır</span></div></header>
<div class="app"><aside><h1>Maili düzenle</h1><p>İçerik sana ait. Tasarım hazır.</p><div class="templates"><button data-template="creative" class="active">Creative Content</button><button data-template="website">Website Review</button></div><nav class="tabs"><button data-tab="content" class="active">İçerik</button><button data-tab="images">Görseller</button><button data-tab="drafts">Taslaklar</button></nav><div id="fields"></div><div class="footnote">Footer ve hizalamalar şablondan gelir. Figma katmanlarındaki serbest değişiklikler HTML’e aktarılmaz.</div></aside>
<main class="preview"><div class="toolbar"><strong>Canlı HTML önizlemesi</strong><div><select id="viewport" aria-label="Önizleme genişliği"><option value="600">Masaüstü · 600 px</option><option value="375">Mobil · 375 px</option></select> <select id="zoom" aria-label="Yakınlaştırma"><option value="0.65">%65</option><option value="0.85">%85</option><option value="1">%100</option></select></div></div><div id="message" role="status" class="message" aria-live="polite"></div><div class="canvas"><div id="preview-holder"><iframe id="preview" sandbox="allow-same-origin" title="E-posta önizlemesi"></iframe></div></div><div class="bottom"><button id="figma">Figma taslağı oluştur</button><button id="download" class="primary">HTML indir ↓</button></div></main></div>
<script>/* BUNDLE */</script></body></html>
